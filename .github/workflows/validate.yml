name: Validate

on:
  push:
    branches: [master, feat/blender-ai-stack, fix/review-p0]
  pull_request:

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config

  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/blender-agent/requirements.txt
          pip install pytest

      - name: Syntax check
        run: |
          python -m py_compile services/blender-agent/app/models.py
          python -m py_compile services/blender-agent/app/blender.py
          python -m py_compile services/blender-agent/app/api.py
          python -m py_compile services/blender-agent/app/mcp_server.py

      - name: Import smoke tests
        working-directory: services/blender-agent
        run: |
          python -c "from app.models import BlendFileInfo, ObjectInfo, ObjectType, SceneInfo, VersionMetadata, ChangeRecord; print('Models OK')"
          python -c "from app.blender import core_list_blend_files, core_inspect_scene, core_duplicate_version, core_render_preview, core_apply_blender_script, resolve_input_blend, resolve_workspace_output; print('Blender OK')"
          python -c "from app.mcp_server import mcp, mcp_app; print('MCP v2 OK:', type(mcp).__module__ + '.' + type(mcp).__name__)"
          python -c "from app.api import app; print('API OK — routes:', len(app.routes))"

      - name: Path safety tests (pytest)
        working-directory: services/blender-agent
        run: python -m pytest tests/ -xvs