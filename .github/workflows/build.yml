name: Build & Push blender-agent

on:
  push:
    branches: [master, feat/blender-ai-stack]
    paths:
      - "services/blender-agent/**"
      - "docker-compose.yml"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ttl.sh (anonymous)
        uses: docker/build-push-action@v6
        with:
          context: ./services/blender-agent
          file: ./services/blender-agent/Dockerfile
          push: true
          tags: |
            ttl.sh/peeragogia/il-portale-agent:latest
            ttl.sh/peeragogia/il-portale-agent:${{ github.sha }}