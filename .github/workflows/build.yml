name: Build & Push il-portale

on:
  push:
    branches: [master, feat/blender-ai-stack]
    paths:
      - "services/blender-agent/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ttl.sh
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ttl.sh/peeragogia/il-portale:latest
            ttl.sh/peeragogia/il-portale:${{ github.sha }}