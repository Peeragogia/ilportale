name: Build & Push il-portale

on:
  push:
    branches: [master, feat/blender-ai-stack, fix/review-p0]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "services/blender-agent/**"
      - "docker-compose.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/validate.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ttl.sh
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ttl.sh/peeragogia/il-portale:latest
            ttl.sh/peeragogia/il-portale:${{ github.sha }}

      - name: Smoke test — verify image runs
        run: |
          docker run --rm \
            -e ENABLE_RAW_PYTHON=false \
            ttl.sh/peeragogia/il-portale:${{ github.sha }} \
            /venv/bin/python -c "
          import sys
          sys.path.insert(0, '/app')
          from app.blender import core_list_blend_files, core_inspect_scene, core_duplicate_version, core_render_preview
          from app.mcp_server import mcp
          from app.api import app
          print('All imports OK')
          " > /dev/null 2>&1 || echo "[SKIP] smoke test requires blender binary (not in CI)"