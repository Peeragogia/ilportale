version: "3.9"

services:
  blender:
    image: lscr.io/linuxserver/blender:latest
    container_name: ilportale-blender
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
      - USER=admin
      - PASSWORD=
    ports:
      - "3000:3000"      # Blender web GUI
    volumes:
      - config:/config
      - workspace:/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN    # Required by linuxserver/blender for DBus/audio
    networks:
      - ilportale-net

  blender-agent:
    image: ghcr.io/peeragogia/il-portale-agent:latest
    container_name: ilportale-agent
    environment:
      - TZ=Europe/Rome
      - API_PORT=8100
      - MCP_PORT=8200
      - WORKSPACE_DIR=/workspace
      - BLENDER_HEADLESS_CMD=blender --background
    ports:
      - "8100:8100"    # HTTP API
      - "8200:8200"    # MCP Streamable HTTP
    volumes:
      - workspace:/workspace
    restart: unless-stopped
    depends_on:
      - blender
    networks:
      - ilportale-net

volumes:
  config:
  workspace:

networks:
  ilportale-net:
    driver: bridge