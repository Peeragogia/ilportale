services:
  il-portale:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: il-portale
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
      - USER=admin
      - API_PORT=8100
      - MCP_PORT=8200
    ports:
      - 3000:3000    # Blender web GUI
      - 8100:8100    # HTTP API backend
      - 8200:8200    # MCP server
    volumes:
      - config:/config
      - workspace:/workspace
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN

volumes:
  config:
  workspace: