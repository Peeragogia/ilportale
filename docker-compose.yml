services:
  blender:
    image: ttl.sh/peeragogia/il-portale:latest
    container_name: ilportale-blender
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
      - CUSTOM_USER=admin
      - PASSWORD=
    expose:
      - 3000
    volumes:
      - config:/config
      - workspace:/workspace
    restart: unless-stopped

  blender-api:
    image: ttl.sh/peeragogia/il-portale:latest
    container_name: ilportale-api
    environment:
      - TZ=Europe/Rome
      - API_PORT=8100
      - WORKSPACE_DIR=/workspace
      - ENABLE_RAW_PYTHON=false
    command: ["/venv/bin/python", "-m", "app.api"]
    expose:
      - 8100
    volumes:
      - workspace:/workspace
    restart: unless-stopped

  blender-mcp:
    image: ttl.sh/peeragogia/il-portale:latest
    container_name: ilportale-mcp
    environment:
      - TZ=Europe/Rome
      - MCP_PORT=8200
      - WORKSPACE_DIR=/workspace
      - ENABLE_RAW_PYTHON=false
    command: ["/venv/bin/python", "-m", "app.mcp_server"]
    expose:
      - 8200
    volumes:
      - workspace:/workspace
    restart: unless-stopped

volumes:
  config:
  workspace: