services:
  blender:
    image: ttl.sh/peeragogia/il-portale:latest
    container_name: ilportale-blender
    networks:
      - coolify
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
      - CUSTOM_USER=admin
      # PASSWORD impostata via Environment Variables di Coolify
    expose:
      - 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.blender.rule=Host(`blender.pyragogy.org`)
      - traefik.http.routers.blender.entrypoints=websecure
      - traefik.http.routers.blender.tls=true
      - traefik.http.services.blender.loadbalancer.server.port=3000
    volumes:
      - config:/config
      - workspace:/workspace
    restart: unless-stopped

  blender-api:
    image: ttl.sh/peeragogia/il-portale:latest
    container_name: ilportale-api
    environment:
      - TZ=Europe/Rome
      - API_PORT=8100
      - WORKSPACE_DIR=/workspace
      - ENABLE_RAW_PYTHON=false
    command: ["/venv/bin/python", "-m", "app.api"]
    expose:
      - 8100
    volumes:
      - workspace:/workspace
    restart: unless-stopped

  blender-mcp:
    image: ttl.sh/peeragogia/il-portale:latest
    container_name: ilportale-mcp
    environment:
      - TZ=Europe/Rome
      - MCP_PORT=8200
      - WORKSPACE_DIR=/workspace
      - ENABLE_RAW_PYTHON=false
    command: ["/venv/bin/python", "-m", "app.mcp_server"]
    expose:
      - 8200
    volumes:
      - workspace:/workspace
    restart: unless-stopped

volumes:
  config:
  workspace:

networks:
  coolify:
    external: true